# Virtual workspace manifest. Per-crate manifests live in crates/*/.
[workspace]
resolver = "2"
members = [
    "crates/fxproto",
    "crates/fxcore",
    "crates/fxserver",
    "crates/fxapp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "SEE LICENSE.md"

# Shared dependency versions, pinned once here; member crates reference them
# with `foo = { workspace = true }`. Bump to current versions as you go.
[workspace.dependencies]
fxproto = { path = "crates/fxproto" }
fxcore = { path = "crates/fxcore" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] } # compat bridges tokio <-> futures-io for ACP transports
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
rand = "0.8"
subtle = "2"
uuid = { version = "1", features = ["v7"] }
flume = "0.11"
if-addrs = "0.13"
axum = { version = "0.8", features = ["ws"] }
async-tungstenite = "0.28"
agent-client-protocol = "1"

gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
