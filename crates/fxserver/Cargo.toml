[package]
name = "fxserver"
description = "Thin daemon shell: config, pairing token, tailnet-bound WebSocket around fxcore"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fxserver"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
fxcore = { workspace = true }
fxproto = { workspace = true }
futures = { workspace = true }
if-addrs = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Dev-only, hermetic: raw WS client for tests/e2e.rs (see impl.md Phase 5.4).
[dev-dependencies]
async-tungstenite = { workspace = true, features = ["tokio-runtime"] }
