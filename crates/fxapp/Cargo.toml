[package]
name = "fxapp"
description = "GPUI client: renders projections from fxproto::model, talks only fxproto"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fxapp"
path = "src/main.rs"

[dependencies]
async-tungstenite = { workspace = true }
futures = { workspace = true }
fxproto = { workspace = true }   # NEVER fxcore — the client cannot spawn agents
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui_platform = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }     # quarantined inside src/conn/ws.rs ONLY
tracing = { workspace = true }
